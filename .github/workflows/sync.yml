name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch --no-tags upstream main

          # This workflow belongs to the fork. Do not attempt to push an
          # upstream change to it: GITHUB_TOKEN cannot update workflow files.
          if git diff --quiet HEAD upstream/main -- . ':(exclude).github/workflows/sync.yml'; then
            echo "No upstream changes outside .github/workflows/sync.yml."
            exit 0
          fi

          if ! git merge --no-commit --no-ff upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -n "$conflicts" ] && [ "$conflicts" != ".github/workflows/sync.yml" ]; then
              git merge --abort
              echo "[Error] Merge conflict detected outside .github/workflows/sync.yml."
              echo "[Error] Merge conflict detected outside the fork-local sync workflow."
              exit 1
            fi
            git checkout --ours -- .github/workflows/sync.yml
            git add .github/workflows/sync.yml
          fi

          # Restore the fork-local workflow before creating the merge commit.
          git restore --source=HEAD --staged --worktree -- .github/workflows/sync.yml

          if git diff --cached --quiet; then
            git merge --abort || true
            echo "No syncable upstream changes; kept .github/workflows/sync.yml."
            exit 0
          fi

          git commit -m "Sync upstream/main"
          git push origin main
